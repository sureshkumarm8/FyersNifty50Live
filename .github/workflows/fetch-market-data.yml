name: Market Data Fetcher

on:
  schedule:
    # Runs every minute from 3:47 AM - 10:00 AM UTC (9:17 AM - 3:30 PM IST)
    - cron: '*/1 3-10 * * 1-5'
  workflow_dispatch: # Manual trigger

jobs:
  fetch-market-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📊 Fetch Live Market Data
        run: |
          echo "🕐 Current Time: $(date)"
          echo "🔄 Fetching market data from Vercel..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fyers-nifty50-live.vercel.app/api/cron/fetch-market-data)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "📡 HTTP Status: $HTTP_CODE"
          echo "📄 Response: $BODY"
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            if echo "$BODY" | grep -q '"success":true'; then
              echo "✅ Market data fetched successfully"
              exit 0
            elif echo "$BODY" | grep -q '"skipped":true'; then
              echo "⏭️  Skipped (outside market hours)"
              exit 0
            fi
          fi
          
          echo "❌ Failed with status $HTTP_CODE"
          exit 1

      - name: 📧 Notify on Failure
        if: failure()
        run: echo "::error::Market data fetch failed!"
