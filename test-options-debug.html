<!DOCTYPE html>
<html>
<head>
  <title>Options Debug Test</title>
</head>
<body>
  <h1>Options Debug Console</h1>
  <div id="output"></div>
  
  <script>
    const output = document.getElementById('output');
    
    // Test fetch from Redis
    fetch('/api/get-redis-data')
      .then(res => res.json())
      .then(data => {
        output.innerHTML = `
          <h2>Redis Data:</h2>
          <pre>${JSON.stringify(data, null, 2)}</pre>
          <h3>Stats:</h3>
          <ul>
            <li>Stocks: ${data.data?.stocks?.length || 0}</li>
            <li>Options: ${data.data?.options?.length || 0}</li>
            <li>Nifty LTP: ${data.data?.niftyLTP || 0}</li>
          </ul>
        `;
      })
      .catch(err => {
        output.innerHTML = `<p style="color:red">Error: ${err.message}</p>`;
      });
  </script>
</body>
</html>
